# Perfil dev: ejecutar sin PostgreSQL ->  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:hotel;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
app.seed.enabled=true
app.jwt.secret=dev-only-secret-dev-only-secret-dev-only-1234
