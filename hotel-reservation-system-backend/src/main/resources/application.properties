spring.application.name=HotelReservationSystem
server.port=3000

spring.datasource.driver-class-name=org.postgresql.Driver
# URL de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel-bd

# Credenciales de la base de datos
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Configuracion JPA/Hibernate ORM
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Loggers
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO


# JWT (JWT_SECRET obligatorio, minimo 32 caracteres; sin valor por defecto a proposito)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120

# Nunca exponer stack traces en respuestas de error (devtools los fuerza si no se fija)
server.error.include-stacktrace=never
